name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  syntax:
    name: Python and JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q custom_components/autarco_local
      - name: Test scenario engine
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/autarco_local/manifest.json >/dev/null
          python -m json.tool custom_components/autarco_local/strings.json >/dev/null
          python -m json.tool custom_components/autarco_local/translations/en.json >/dev/null
          python -m json.tool custom_components/autarco_local/translations/nl.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Validate frontend JavaScript
        run: |
          for file in custom_components/autarco_local/frontend/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
