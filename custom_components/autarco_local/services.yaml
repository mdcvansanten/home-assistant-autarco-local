unlock_settings:
  name: Unlock Autarco Local settings
  description: >-
    Unlocks write-capable Autarco Local settings for the current logged-in Home
    Assistant user for ten minutes after validating the configured settings PIN.
  fields:
    pin:
      name: Settings PIN
      description: PIN configured in Autarco Local → Configure.
      required: true
      selector:
        text:
          type: password
    config_entry_id:
      name: Config entry ID
      description: >-
        Optional. Required only when more than one Autarco Local config entry is
        loaded.
      required: false
      selector:
        text:

lock_settings:
  name: Lock Autarco Local settings
  description: Immediately revokes the current user's temporary settings unlock.
  fields:
    config_entry_id:
      name: Config entry ID
      description: >-
        Optional. Required only when more than one Autarco Local config entry is
        loaded.
      required: false
      selector:
        text:

set_off_grid_minimum_soc:
  name: Set Off-grid minimum SOC
  description: >-
    Guarded Expert write for the single hardware-validated Off-grid minimum SOC
    setting (holding register 43137). Accepts the documented 10–100% range and
    requires an active PIN unlock plus explicit confirmation. If Off-grid is
    already active it remains active. If Autarco Local must temporarily activate
    Off-grid, the original complete work-mode state is restored and verified
    afterwards. No other setting register is opened by this service.
  fields:
    soc:
      name: Target SOC
      description: Target Off-grid minimum SOC from 10% through 100%.
      required: true
      example: 21
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    confirm:
      name: Confirm expert write
      description: >-
        Explicit confirmation that this Expert write may temporarily activate
        Off-grid when it was not already active and will then restore the
        original work-mode state.
      required: true
      example: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry ID
      description: >-
        Optional. Required only when more than one Autarco Local config entry is
        loaded.
      required: false
      selector:
        text:
